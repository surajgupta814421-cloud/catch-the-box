<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catch The Box</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>🎮 Catch The Box</h1>

        <div class="stats">

            <div>
                <span>Score</span>
                <strong id="score">0</strong>
            </div>

            <div>
                <span>Time</span>
                <strong id="time">30</strong>
            </div>

        </div>

        <div id="game-area">

            <button id="box"></button>

        </div>

        <button id="start-btn">
            Start Game
        </button>

        <p id="message">
            Click Start Game to begin!
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
